<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3: Таблица Human</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        button {
            background: #f1f5f9;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-left: auto;
            align-items: center;
        }

        .filter-group span {
            font-weight: 600;
            color: #475569;
        }

        .filter-btn {
            background: #e2e8f0;
        }

        .filter-btn.active {
            background: #3b82f6;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        tr:hover {
            background: #fefce8;
        }

        .editable {
            cursor: text;
            transition: background 0.1s;
        }

        .editable:hover {
            background: #fef9c3;
        }

        .gender-select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
        }

        .delete-row-btn {
            background: #fee2e2;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-row-btn:hover {
            background: #fecaca;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 16px;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        📋 Управление данными о людях
        <span style="font-size: 14px; background: #e2e8f0; padding: 4px 12px; border-radius: 20px;">Задание №3</span>
    </h1>
    <div class="subtitle">
        Асинхронная загрузка данных | Редактирование | Фильтрация по полу | Цветовая индикация возраста
    </div>

    <div class="toolbar">
        <button id="loadBtn" class="btn-primary">📂 Загрузить данные</button>
        <button id="addBtn">➕ Добавить человека</button>
        <button id="deleteSelectedBtn" class="btn-danger">🗑️ Удалить выбранных</button>

        <div class="filter-group">
            <span>🎯 Фильтр:</span>
            <button id="filterAll" class="filter-btn active">Все</button>
            <button id="filterMale" class="filter-btn">👨 Мужчины</button>
            <button id="filterFemale" class="filter-btn">👩 Женщины</button>
        </div>
    </div>

    <div id="tableContainer" class="table-wrapper"></div>
    <footer>
        ✅ Зелёный — до 18 лет | 🟡 Жёлтый — 18–60 лет | 🔴 Красный — старше 60
    </footer>
</div>

<script>

    const firstNames = ["Иван", "Александра", "Даниил", "Марина", "Антон", "Евгения", "Сергей", "Алина", "Алексей", "Анна"];
    const lastNames = ["Толкачев", "Куракова", "Улискин", "Симонова", "Чистюхин", "Васильева"];
    const cities = ["Москва", "СПб", "Новосибирск", "Кемеровог", "Казань"];
    const streets = ["Ленина", "Пушкина", "Гагарина", "Мира", "Советская", "Центральная"];
    const phones = ["+7(900)111-2233", "+7(901)222-3344", "+7(902)333-4455", "+7(903)444-5566", "+7(904)555-6677"];
    
    // Функция определения пола по имени 
    function getGenderByName(name) {
        const maleNames = ["Иван", "Даниил", "Антон", "Сергей", "Алексей"];
        return maleNames.includes(name) ? "male" : "female";
    }
    
    // Генерация полного адреса из ваших городов
    function generateAddress() {
        const city = cities[Math.floor(Math.random() * cities.length)];
        const street = streets[Math.floor(Math.random() * streets.length)];
        const house = Math.floor(Math.random() * 100) + 1;
        const apartment = Math.floor(Math.random() * 200) + 1;
        return `${city}, ул.${street}, д.${house}, кв.${apartment}`;
    }
    
    // Генерация случайного телефона
    function generatePhone() {
        return phones[Math.floor(Math.random() * phones.length)];
    }
    
    // Асинхронная функция getData() - возвращает массив случайного размера (от 3 до 15)
    const humansData = {
        getData: async () => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const size = Math.floor(Math.random() * 13) + 3;
                    const humans = [];
                    
                    for (let i = 0; i < size; i++) {
                        const name = firstNames[Math.floor(Math.random() * firstNames.length)];
                        const surname = lastNames[Math.floor(Math.random() * lastNames.length)];
                        const age = Math.floor(Math.random() * 90) + 1;
                        const gender = getGenderByName(name);
                        const address = generateAddress();
                        const phone = generatePhone();
                        
                        humans.push({
                            id: Date.now() + i + Math.random() * 10000,
                            name: name,
                            surname: surname,
                            age: age,
                            gender: gender,
                            address: address,
                            phone: phone
                        });
                    }
                    resolve(humans);
                }, 300);
            });
        }
    };


    let currentData = [];      
    let currentFilter = "all"; 

    function getFilteredData() {
        if (currentFilter === "male") {
            return currentData.filter(h => h.gender === "male");
        } else if (currentFilter === "female") {
            return currentData.filter(h => h.gender === "female");
        }
        return [...currentData];
    }

    // Функция получения цвета строки в зависимости от возраста
    function getRowColorByAge(age) {
        if (age < 18) return "#e8f5e9"; 
        if (age <= 60) return "#fffde7"; 
        return "#ffebee"; 
    }

    // Рендер таблицы
    function renderTable() {
        const container = document.getElementById("tableContainer");
        const filteredData = getFilteredData();
        
        if (!filteredData.length) {
            container.innerHTML = `<div class="empty-state">📭 Нет данных. Нажмите "Загрузить данные" или добавьте нового человека.</div>`;
            return;
        }

        // Создаем таблицу
        const table = document.createElement("table");
        table.innerHTML = `
            <thead>
                <tr>
                    <th style="width: 30px;"><input type="checkbox" id="selectAllCheckbox" class="checkbox"></th>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th style="width: 70px;">Возраст</th>
                    <th style="width: 100px;">Пол</th>
                    <th>Адрес</th>
                    <th>Телефон</th>
                    <th style="width: 60px;">Действие</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        `;
        
        const tbody = table.querySelector("#tableBody");
        
        filteredData.forEach(human => {
            const row = tbody.insertRow();
            const bgColor = getRowColorByAge(human.age);
            row.style.backgroundColor = bgColor;
            
            // Создаем ячейки
            const cellCheckbox = row.insertCell(0);
            const cellName = row.insertCell(1);
            const cellSurname = row.insertCell(2);
            const cellAge = row.insertCell(3);
            const cellGender = row.insertCell(4);
            const cellAddress = row.insertCell(5);
            const cellPhone = row.insertCell(6);
            const cellAction = row.insertCell(7);
            
            // Чекбокс
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "checkbox rowCheckbox";
            checkbox.dataset.id = human.id;
            cellCheckbox.appendChild(checkbox);
            
            // Имя (редактируемое)
            cellName.contentEditable = "true";
            cellName.className = "editable";
            cellName.textContent = human.name;
            cellName.dataset.id = human.id;
            cellName.dataset.field = "name";
            
            // Фамилия (редактируемая)
            cellSurname.contentEditable = "true";
            cellSurname.className = "editable";
            cellSurname.textContent = human.surname;
            cellSurname.dataset.id = human.id;
            cellSurname.dataset.field = "surname";
            
            // Возраст (редактируемый)
            cellAge.contentEditable = "true";
            cellAge.className = "editable";
            cellAge.textContent = human.age;
            cellAge.dataset.id = human.id;
            cellAge.dataset.field = "age";
            
            // Пол (выпадающий список)
            const genderSelect = document.createElement("select");
            genderSelect.className = "gender-select";
            genderSelect.dataset.id = human.id;
            const optionMale = document.createElement("option");
            optionMale.value = "male";
            optionMale.textContent = "Мужской";
            const optionFemale = document.createElement("option");
            optionFemale.value = "female";
            optionFemale.textContent = "Женский";
            genderSelect.appendChild(optionMale);
            genderSelect.appendChild(optionFemale);
            genderSelect.value = human.gender;
            cellGender.appendChild(genderSelect);
            
            // Адрес (редактируемый)
            cellAddress.contentEditable = "true";
            cellAddress.className = "editable";
            cellAddress.textContent = human.address;
            cellAddress.dataset.id = human.id;
            cellAddress.dataset.field = "address";
            
            // Телефон (редактируемый)
            cellPhone.contentEditable = "true";
            cellPhone.className = "editable";
            cellPhone.textContent = human.phone;
            cellPhone.dataset.id = human.id;
            cellPhone.dataset.field = "phone";
            
            // Кнопка удаления строки
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "🗑️";
            deleteBtn.className = "delete-row-btn";
            deleteBtn.onclick = () => deleteRowById(human.id);
            cellAction.appendChild(deleteBtn);
        });
        
        container.innerHTML = "";
        container.appendChild(table);
        
        attachEditHandlers();
        
        // Обработчик для select-ов (пола)
        attachGenderHandlers();
        
        // Обработчик "выбрать все"
        const selectAllCheckbox = document.getElementById("selectAllCheckbox");
        if (selectAllCheckbox) {
            selectAllCheckbox.onclick = (e) => {
                const isChecked = e.target.checked;
                document.querySelectorAll(".rowCheckbox").forEach(cb => {
                    cb.checked = isChecked;
                });
            };
        }
    }
    
    // Привязка обработчиков для редактируемых полей
    function attachEditHandlers() {
        const editables = document.querySelectorAll(".editable");
        editables.forEach(el => {
            el.removeEventListener("blur", handleEditBlur);
            el.addEventListener("blur", handleEditBlur);
        });
    }
    
    function handleEditBlur(e) {
        const element = e.target;
        const id = parseFloat(element.dataset.id);
        const field = element.dataset.field;
        let newValue = element.textContent.trim();
        
        const human = currentData.find(h => h.id === id);
        if (!human) return;
        
        if (field === "age") {
            const ageNum = parseInt(newValue);
            if (!isNaN(ageNum) && ageNum > 0 && ageNum <= 120) {
                human.age = ageNum;
            } else {
                element.textContent = human.age;
                return;
            }
        } else if (field === "name" || field === "surname") {
            if (newValue === "") {
                element.textContent = human[field];
                return;
            }
            human[field] = newValue;
        } else if (field === "address" || field === "phone") {
            if (newValue === "") {
                element.textContent = human[field];
                return;
            }
            human[field] = newValue;
        } else {
            human[field] = newValue;
        }
        renderTable();
    }
    
    function attachGenderHandlers() {
        const selects = document.querySelectorAll(".gender-select");
        selects.forEach(select => {
            select.removeEventListener("change", handleGenderChange);
            select.addEventListener("change", handleGenderChange);
        });
    }
    
    function handleGenderChange(e) {
        const id = parseFloat(e.target.dataset.id);
        const newGender = e.target.value;
        const human = currentData.find(h => h.id === id);
        if (human) {
            human.gender = newGender;
            renderTable();
        }
    }
    
    // Удаление по одной записи
    function deleteRowById(id) {
        currentData = currentData.filter(h => h.id !== id);
        renderTable();
    }
    
    // Удаление выбранных
    function deleteSelected() {
        const checkboxes = document.querySelectorAll(".rowCheckbox:checked");
        const idsToDelete = Array.from(checkboxes).map(cb => parseFloat(cb.dataset.id));
        if (idsToDelete.length === 0) {
            alert("Выберите хотя бы одну запись для удаления.");
            return;
        }
        currentData = currentData.filter(h => !idsToDelete.includes(h.id));
        renderTable();
    }
    
    // Добавление нового человека 
    function addNewHuman() {
        const newId = Date.now() + Math.random() * 1000;
        const randomName = firstNames[Math.floor(Math.random() * firstNames.length)];
        const randomSurname = lastNames[Math.floor(Math.random() * lastNames.length)];
        const randomGender = getGenderByName(randomName);
        
        const newHuman = {
            id: newId,
            name: randomName,
            surname: randomSurname,
            age: 30,
            gender: randomGender,
            address: `${cities[0]}, ул.Новая, д.1, кв.1`,
            phone: "+7(999)123-45-67"
        };
        currentData.push(newHuman);
        renderTable();
    }
    
    // Загрузка данных через асинхронный модуль humansData
    async function loadData() {
        try {
            const container = document.getElementById("tableContainer");
            container.innerHTML = `<div class="empty-state">⏳ Загрузка данных из модуля humansData...</div>`;
            
            const loadedData = await humansData.getData();
            currentData = loadedData;
            renderTable();
        } catch (error) {
            console.error("Ошибка загрузки данных:", error);
            document.getElementById("tableContainer").innerHTML = 
                `<div class="empty-state">❌ Ошибка загрузки данных. Попробуйте снова.</div>`;
        }
    }
    
    // Установка фильтра
    function setFilter(filter) {
        currentFilter = filter;
        document.getElementById("filterAll").classList.remove("active");
        document.getElementById("filterMale").classList.remove("active");
        document.getElementById("filterFemale").classList.remove("active");
        
        if (filter === "all") document.getElementById("filterAll").classList.add("active");
        if (filter === "male") document.getElementById("filterMale").classList.add("active");
        if (filter === "female") document.getElementById("filterFemale").classList.add("active");
        
        renderTable();
    }
    

    document.getElementById("loadBtn").onclick = loadData;
    document.getElementById("addBtn").onclick = addNewHuman;
    document.getElementById("deleteSelectedBtn").onclick = deleteSelected;
    document.getElementById("filterAll").onclick = () => setFilter("all");
    document.getElementById("filterMale").onclick = () => setFilter("male");
    document.getElementById("filterFemale").onclick = () => setFilter("female");
    
    console.log("✅ Задание №3 готово. Используются ваши массивы:");
    console.log("Имена:", firstNames);
    console.log("Фамилии:", lastNames);
    console.log("Города:", cities);
</script>
</body>
</html>
